name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - grandmaster

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: npm i -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project harish-devv --token "${{ secrets.FIREBASE_TOKEN }}"
